<!--Ejercicio 8
Accederemos a los datos de una API pública de Game Of Thrones, queremos un select con todos los nombres de los personajes para que cuando un usuario seleccione un nombre salga su imagen en el medio de la página, algo así:

Os aportamos el HTML sobre el que haremos el ejercicio:-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js" defer></script>
    <!-- le meti el en css aqui, es una guarrada pero me estaba dando toc ver los diferentes tamaños -->
    <style>
        /* Seleccionamos la imagen por su clase */
        .character-image {
            width: 200px;/* ancho fijo */
            height: 300px;/* alto fijo */
            object-fit: cover; /* para que no se deforme */
            border-radius: 8px; /* redondeamos bordes*/
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); /*sombrita pequeña */
            margin-top: 10px; /*para que no quede pegado al desplegable */
        }
    </style>



</head>
<body>
    <select id="character-list"></select>
    <div>
        <img class="character-image">
    </div>
</body>
</html>
